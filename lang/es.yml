es:
  'Kalakotra\EFormAnmeldungFrankfurt\Forms\Form_Step1':
    'IntroText': 'Nueva vivienda en Fráncfort del Meno'
    'GeneralNotice': 'Quien se muda a una vivienda debe empadronarse en la oficina de registro (Meldebehörde) en un plazo de dos semanas. Traiga un documento de identidad válido y la confirmación del arrendador (Wohnungsgeberbestätigung).'
    'RegistrationType': 'La nueva vivienda es'
    'RegistrationType.main': 'vivienda única o principal (alleinige Wohnung oder Hauptwohnung)'
    'RegistrationType.secondary': 'vivienda secundaria (Nebenwohnung)'
    'DEFAULT_SELECT': 'Seleccione'
    'RegistrationTypeDescription': 'La vivienda principal es la que se utiliza predominantemente; para personas casadas, la vivienda que utiliza predominantemente la familia.'
    'MoveInDate': 'Fecha de mudanza'
    'PostalCode': 'Código postal'
    'District': 'Barrio (Ortsteil) (opcional)'
    'Street': 'Calle, número'
