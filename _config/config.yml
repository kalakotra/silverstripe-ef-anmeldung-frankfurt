# Signatures in mm from the top-left corner; negative page = counted from the end
# (-3 Meldeschein, -2 Beiblatt, -1 Ausfertigung für die meldepflichtige Person), so the positions also fit a
# PDF without the two explanation pages. PDFMultiFormPage.SignaturePositionX/Y override "meldeschein" and "copy".
#
# Kalakotra\EFormAnmeldungFrankfurt\Model\Submission:
#   signature_positions:
#     meldeschein: { page: -3, x: 135.0, y: 273.0, width: 36.0 }
#     beiblatt: { page: -2, x: 134.0, y: 231.5, width: 44.0 }
#     copy: { page: -1, x: 135.0, y: 273.0, width: 36.0 }
#   replacement_font: 'fonts/LiberationSans-Regular.ttf'   # '' = disabled (then values are transliterated to ASCII)
