    'DocumentNumber': 'Número de serie'
    'DocumentIssued': 'Fecha de expedición'
    'DocumentValidUntil': 'Válido hasta'
    'BlockHeader': 'Bloqueos de transmisión y de información (opcional)'
    'Block1': 'N.º 1: contra la transmisión de datos a una sociedad religiosa de derecho público a través de familiares de un miembro (§ 42 apdo. 3 frase 2 BMG)'
    'Block2': 'N.º 2: contra la transmisión de datos con motivo de aniversarios de edad o de boda (§ 50 apdo. 2 BMG)'
    'Block3': 'N.º 3: contra la transmisión de datos a partidos, agrupaciones de electores, etc. en elecciones y votaciones (§ 50 apdo. 1 BMG)'
    'Block4': 'N.º 4: contra la transmisión de datos a editoriales de guías de direcciones (§ 50 apdo. 3 BMG)'
    'Block5': 'N.º 5: contra la transmisión de datos a la Oficina Federal de Gestión de Personal de la Bundeswehr (§ 36 apdo. 2 BMG)'
    'Block6': 'N.º 6: bloqueo de toda información del registro de población (§ 51 BMG)'
    'Block6Notice': 'El bloqueo n.º 6 solo es posible en caso de peligro para la vida, la salud, la libertad personal u otros intereses similares dignos de protección. Debe justificarse por escrito por separado y está limitado a dos años (§ 51 apdo. 4 BMG).'
    'More': '¿Desea empadronar a otra persona en este formulario?'
    'More.no': 'no'
    'More.yes': 'sí'
  'Kalakotra\EFormAnmeldungFrankfurt\Forms\Form_Step3':
    'IntroText': 'Hoja adicional al formulario de registro (Beiblatt zum Meldeschein)'
    'FamilyNotice': 'Punto 16: Aquí se indican los cónyuges/parejas de hecho y los hijos menores que no se mudan con usted a la nueva vivienda o ya están empadronados allí, así como los representantes legales de menores.'
    'SpouseNotMoving': 'a) ¿Hay un cónyuge/pareja de hecho que no se empadrona con usted?'
    'SpouseNotMoving.no': 'no'
    'SpouseNotMoving.yes': 'sí'
    'DEFAULT_SELECT': 'Seleccione'
    'SpouseLastName': 'Apellido (en su caso apellido de nacimiento distinto, grado de doctor)'
