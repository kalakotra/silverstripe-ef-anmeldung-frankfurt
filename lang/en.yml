  'Kalakotra\EFormAnmeldungFrankfurt\Forms\Form_Step1':
    'IntroText': 'New residence in Frankfurt am Main'
    'GeneralNotice': 'Anyone who moves into a residence must register with the registration office (Meldebehörde) within two weeks. Please bring a valid ID document and the landlord''s confirmation (Wohnungsgeberbestätigung).'
    'RegistrationType': 'The new residence is'
    'RegistrationType.main': 'sole or main residence (alleinige Wohnung oder Hauptwohnung)'
    'RegistrationType.secondary': 'secondary residence (Nebenwohnung)'
    'DEFAULT_SELECT': 'Please select'
    'RegistrationTypeDescription': 'The main residence is the residence used predominantly; for married persons, the residence predominantly used by the family.'
    'MoveInDate': 'Moving-in date'
    'PostalCode': 'Postcode'
    'District': 'District (Ortsteil) (optional)'
    'Street': 'Street, house number'
    'AddressAddition': 'Address supplement (optional)'
    'AddressAdditionDescription': 'e.g. floor, rear building; for subtenants, the name of the main tenant if your own name is not on the mailbox'
