    'HasRepresentative.no': 'no'
    'HasRepresentative.yes': 'sí'
    'HasRepresentativeDescription': 'Si los padres representan al hijo conjuntamente, deben indicarse ambos; si el representante legal es la oficina de protección de menores (Jugendamt), se indica esta.'
    'RepresentativeLastName': 'Apellido (en su caso apellido de nacimiento distinto, grado de doctor) u oficina de protección de menores (Jugendamt)'
    'RepresentativeFirstNames': 'Nombre(s)'
    'RepresentativeBirthDate': 'Fecha de nacimiento (opcional)'
    'RepresentativeAddress': 'Dirección (código postal, localidad, calle, n.º) (opcional)'
