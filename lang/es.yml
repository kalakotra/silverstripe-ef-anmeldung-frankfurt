  'Kalakotra\EFormAnmeldungFrankfurt\Forms\PersonStepTrait':
    'DEFAULT_SELECT': 'Seleccione'
    'IntroText': 'Persona {number}'
    'FamilyNotice': 'Los familiares y parejas de hecho pueden empadronarse juntos en un mismo formulario de registro (Meldeschein) (hasta 5 personas) si todos tienen la misma vivienda anterior y nueva. Para personas con circunstancias de registro distintas debe rellenarse un formulario propio.'
